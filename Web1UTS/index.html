<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Toko Buku Online</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="login-page">
    <main class="login-container">
        <h2>Login Toko Buku</h2>
        <form onsubmit="handleLogin(event)">
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" required>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" required>
            </div>
            <button type="submit" class="btn btn-primary">Login</button>
        </form>
        <div class="login-actions">
            <button class="btn btn-link" onclick="openModal('modal-lupa')">Lupa Password</button>
            <button class="btn btn-link" onclick="openModal('modal-daftar')">Daftar</button>
        </div>
    </main>

    <!-- Modal Lupa Password -->
    <div id="modal-lupa" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeModal('modal-lupa')">×</span>
            <h3>Lupa Password</h3>
            <p>Masukkan email Anda untuk mereset password.</p>
            <input type="email" placeholder="Email Anda" class="form-control">
            <button class="btn btn-primary" onclick="closeModal('modal-lupa')">Kirim Instruksi</button>
        </div>
    </div>

    <!-- Modal Daftar -->
    <div id="modal-daftar" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeModal('modal-daftar')">×</span>
            <h3>Daftar Akun Baru</h3>
            <input type="text" placeholder="Nama Lengkap" class="form-control">
            <input type="email" placeholder="Email" class="form-control">
            <input type="password" placeholder="Password" class="form-control">
            <button class="btn btn-primary" onclick="closeModal('modal-daftar')">Daftar Sekarang</button>
        </div>
    </div>

    <script src="js/data.js"></script>
    <script src="js/script.js"></script>
</body>
</html>
