<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pemesanan - Toko Buku Online</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="navbar">
        <!-- Tambahkan brand-container ini -->
        <div class="brand-container">
            <img src="assets/logo-universitas-pelita-bangsa-upb-png-svg.webp" alt="Logo UPB" class="navbar-logo">
            <h1>Toko Buku Online</h1>
        </div>
        <nav>
            <a href="dashboard.html">Dashboard</a>
            <a href="stok.html">Informasi Stok</a>
            <a href="tracking.html">Tracking Pengiriman</a>
            <a href="checkout.html" class="active">Pemesanan</a>
            <a href="index.html">Logout</a>
        </nav>
    </header>
    <main class="container">
        <h2>Formulir Pemesanan</h2>
        <form onsubmit="prosesPemesanan(event)" class="checkout-form">
            <fieldset>
                <legend>Informasi Pemesan</legend>
                <div class="form-group">
                    <label>Nama Lengkap</label>
                    <input type="text" required>
                </div>
                <div class="form-group">
                    <label>Alamat Pengiriman</label>
                    <textarea rows="3" required></textarea>
                </div>
            </fieldset>

            <fieldset>
                <legend>Detail Pesanan & Pembayaran</legend>
                <div class="form-group">
                    <label>Buku yang Dipesan</label>
                    <select id="pilihan-buku" required>
                        <option value="">-- Pilih Buku --</option>
                        <!-- Opsi dirender via JS -->
                    </select>
                </div>
                <div class="form-group">
                    <label>Metode Pembayaran</label>
                    <select required>
                        <option value="transfer">Transfer Bank</option>
                        <option value="ewallet">E-Wallet</option>
                        <option value="cod">Cash on Delivery</option>
                    </select>
                </div>
            </fieldset>
            <button type="submit" class="btn btn-success">Proses Pesanan</button>
        </form>
    </main>

    <script src="js/data.js"></script>
    <script src="js/script.js"></script>
</body>
</html>
